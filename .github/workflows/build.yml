name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep 'MARKETING_VERSION' project.yml | head -n1 | sed -E 's/.*"(.*)".*/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project WithDays.xcodeproj \
            -scheme WithDays \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated)|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/WithDays.app

      - name: Show compile errors
        if: failure()
        run: |
          # Surface each compiler error as an annotation so it shows on the run summary.
          grep -E "^/.*: error: " build.log | sort -u | head -n 50 | while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1 | sed "s|$GITHUB_WORKSPACE/||")
            row=$(echo "$line" | cut -d: -f2)
            msg=$(echo "$line" | sed -E 's/^[^ ]+ error: //')
            echo "::error file=$file,line=$row::$msg"
          done
          grep -E "error:" -A3 build.log | head -n 200 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WithDays.app Payload/
          # The build is unsigned, so embed the App Group entitlements with an ad-hoc signature
          # (extension first, then the app); SideStore reads them when it re-signs.
          codesign -f -s - --entitlements Entitlements/WithDaysWidget.entitlements Payload/WithDays.app/PlugIns/WithDaysWidget.appex
          codesign -f -s - --entitlements Entitlements/WithDays.entitlements Payload/WithDays.app
          codesign -d --entitlements - Payload/WithDays.app
          zip -qry WithDays.ipa Payload
          ls -l WithDays.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WithDays-ipa
          path: WithDays.ipa

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WithDays.ipa
          generate_release_notes: true

      - name: Update SideStore source
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          SIZE=$(stat -f%z WithDays.ipa)
          git fetch origin main
          git checkout main
          python3 scripts/update_source.py \
            --version "${{ steps.version.outputs.version }}" \
            --build "${{ github.run_number }}" \
            --size "$SIZE" \
            --url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/WithDays.ipa"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Update SideStore source to ${{ github.ref_name }}" || exit 0
          git push origin main
